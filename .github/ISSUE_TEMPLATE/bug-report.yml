name: Bug report
description: Tell us when FFS behaved badly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "This report and any attachments will be public. Remove personal details, workplace information and anything you do not want to share. FFS never sends diagnostics automatically."
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Please describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ..."
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional safe diagnostics
      description: Paste FFS > Settings > About > Copy diagnostic information if useful. Review it first; anything pasted here is public.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked the text above and removed anything I do not want to share.
          required: true
